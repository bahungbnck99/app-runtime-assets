name: Build sensitive-content runtime

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Runtime version and release tag suffix
        required: true
        default: 1.0.0-candidate.3
      definition_path:
        description: Pinned model source definition in this repository
        required: true
        default: sources/sensitive-content-candidates-1.0.0.json
      qualification_report_path:
        description: Signed qualification report in this repository
        required: true
        default: sensitive-content/qualification/qualification-template.json
      publish_production:
        description: Publish GitHub Release and production manifest/registry
        required: true
        type: boolean
        default: false
      publish_candidate_release:
        description: Publish a candidate GitHub prerelease without changing the production registry
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: sensitive-content/worker/requirements-build.txt

      - name: Confirm FFmpeg
        shell: pwsh
        run: |
          $command = Get-Command ffmpeg -ErrorAction Stop
          & $command.Source -hide_banner -version

      - name: Build candidate pack
        if: ${{ !inputs.publish_production }}
        shell: powershell
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools/update-sensitive-content.ps1
          -RuntimeVersion "${{ inputs.runtime_version }}"
          -DefinitionPath "${{ inputs.definition_path }}"
          -QualificationReportPath "${{ inputs.qualification_report_path }}"

      - name: Build production-qualified pack
        if: ${{ inputs.publish_production }}
        shell: powershell
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools/update-sensitive-content.ps1
          -RuntimeVersion "${{ inputs.runtime_version }}"
          -DefinitionPath "${{ inputs.definition_path }}"
          -QualificationReportPath "${{ inputs.qualification_report_path }}"
          -PublishManifest

      - name: Verify release bytes independently
        shell: powershell
        run: >
          powershell -NoProfile -ExecutionPolicy Bypass
          -File tools/verify-sensitive-content.ps1
          -ManifestPath manifests/sensitive-content.candidate.json
          -ArchivePath packs/sensitive-content/sensitive-content-windows-x86_64.zip

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: sensitive-content-${{ inputs.runtime_version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            packs/sensitive-content/sensitive-content-windows-x86_64.zip
            manifests/sensitive-content.candidate.json
            checksums/SHA256SUMS.txt

      - name: Publish candidate GitHub prerelease
        if: ${{ !inputs.publish_production && inputs.publish_candidate_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "sensitive-content-${{ inputs.runtime_version }}"
          gh release create $tag `
            "packs/sensitive-content/sensitive-content-windows-x86_64.zip" `
            "manifests/sensitive-content.candidate.json" `
            "checksums/SHA256SUMS.txt" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title $tag `
            --prerelease `
            --notes "Engineering-only sensitive-content candidate. Not registered for application installation."

      - name: Publish immutable GitHub Release
        if: ${{ inputs.publish_production }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "sensitive-content-${{ inputs.runtime_version }}"
          gh release create $tag `
            "packs/sensitive-content/sensitive-content-windows-x86_64.zip" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title $tag `
            --notes "Production-qualified sensitive-content runtime ${{ inputs.runtime_version }}."

      - name: Publish production manifest and registry
        if: ${{ inputs.publish_production }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/sensitive-content.json manifests/registry.json checksums/SHA256SUMS.txt
          git commit -m "release sensitive-content runtime ${{ inputs.runtime_version }}"
          git push origin "HEAD:${{ github.ref_name }}"
